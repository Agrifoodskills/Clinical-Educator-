id: clinical-educator
title: Clinical Educator
ects: 5
workload_hours: 120
workload:
  contact: 36
  self_study: 60
  assessment: 24
outcomes:
  - Design and deliver teaching sessions in clinical settings
  - Give feedback that changes learner practice
  - Assess learner competence against defined outcomes
  - Supervise and support learners in the workplace
requires:
  - competency: CE1
    min_dok: 3
  - competency: CE2
    min_dok: 3
  - competency: CE3
    min_dok: 3
  - competency: CE4
    min_dok: 2
  - competency: CE5
    min_dok: 2
# Modules list the sessions that exist. As the remaining sessions are
# authored, add them here — the corpus build warns while the summed
# session durations drift from workload.contact, which is the intended
# nag until the course is complete.
modules:
  - title: Foundations of clinical teaching
    sessions: [ce-01]
  - title: Assessment and feedback
    sessions: [ce-02]
assessment:
  - type: portfolio
    assesses: [CE1, CE2, CE3, CE4, CE5]
    notes: Teaching portfolio with observed sessions and reflective log
