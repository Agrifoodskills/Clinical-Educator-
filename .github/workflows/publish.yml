name: Publish library

# Renders every session with the FAIR engine and publishes this
# library's data/ (catalog.json + decks) to GitHub Pages, where the
# FAIR assembler's Library picker can add it as a source.
#
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the FAIR renderer
        run: >
          pip install
          "fair-renderer @ git+https://github.com/imbowen1973/FAIR.git@main#subdirectory=renderer"
      - name: Build the library corpus
        run: >
          fair-corpus
          --sessions sessions
          --template template.pptx
          --layout-map layout-map.yaml
          --framework competencies/framework.yaml
          --credentials credentials
          --out _site/data
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
